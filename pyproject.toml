[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neko-video-downloader"
version = "1.0.0"
description = "A polished desktop GUI for yt-dlp with format inspection, cookies, diagnostics, and one-click updates."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [{name = "kagurumi"}]
keywords = ["yt-dlp", "video-downloader", "youtube", "bilibili", "pyqt5"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "PyQt5>=5.15.11,<6",
  "yt-dlp[default]",
]

[project.scripts]
neko-downloader = "neko_downloader.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
